<svg width="280" height="52" viewBox="0 0 280 52" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End User Privacy — Privacy Intelligence">
  <title>End User Privacy</title>
  <desc>End User Privacy wordmark on navy. Two-tone Meridian Mark: white frame + latitudes; teal-on-navy meridian arcs.</desc>
  <!-- Meridian Mark, two-tone. Frame + latitude on white, meridian accents on #69c9be. -->
  <g aria-hidden="true">
    <!-- Outer frame -->
    <circle cx="26" cy="26" r="23" fill="none" stroke="#ffffff" stroke-width="2.25"/>
    <!-- Latitudes -->
    <line x1="3.5" y1="26" x2="48.5" y2="26" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round"/>
    <path d="M 6 16 Q 26 12 46 16" fill="none" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" opacity="0.7"/>
    <path d="M 6 36 Q 26 40 46 36" fill="none" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" opacity="0.7"/>
    <!-- Meridian accents (teal-on-navy #69c9be) -->
    <ellipse cx="26" cy="26" rx="9" ry="23" fill="none" stroke="#69c9be" stroke-width="2.25"/>
    <circle cx="39" cy="26" r="3" fill="#69c9be"/>
  </g>
  <!-- Wordmark: Inter 700, -1% tracking -->
  <text x="68" y="28" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.19" fill="#ffffff">End User Privacy</text>
  <!-- Descriptor: small-caps in brand-mist -->
  <text x="68.5" y="43" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#b5ccd6" style="letter-spacing:0.28em">PRIVACY INTELLIGENCE</text>
</svg>
